name: Run Bot
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          npm install
          npm install -g cc-connect
      
      - name: Setup and Run Bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p ~/.cc-connect
          
          # 直接用命令强行写一个合法的配置文件进去
          cat << 'EOF' > ~/.cc-connect/config.toml
          [projects.main]
          name = "main"
          
          [projects.main.agent]
          type = "claudecode"
          
          [projects.main.agent.options]
          cmd = "node claude-fast.js"
          mode = "acceptEdits"
          system_prompt = "你是一个AI助手，请扮演一个猫娘跟我聊天。"
          work_dir = "/home/runner/work/pocket-wechat-bot/pocket-wechat-bot"
          
          [projects.main.platforms]
          
          [projects.main.platforms.options]
          allow_from = "*"
          EOF
          
          # 强行启动生成二维码
          timeout 120 cc-connect weixin new --config /home/runner/.cc-connect/config.toml || true
