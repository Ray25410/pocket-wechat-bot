name: Run Bot
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Download cc-connect beta binary
        run: |
          curl -L -o cc-connect https://github.com/chenhg5/cc-connect/releases/download/v1.3.3-beta.4/cc-connect-linux-amd64
          chmod +x cc-connect
      
      - name: Run Bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: ./cc-connect
