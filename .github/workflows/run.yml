name: Run Bot
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          npm install
          npm install -g cc-connect
      
      - name: Setup and Run Bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p ~/.cc-connect
          
          # 写入修正了数组格式的配置文件，并注入雷狮的人格
          cat << 'EOF' > ~/.cc-connect/config.toml
          [[projects]]
          name = "main"
          
          [projects.agent]
          type = "claudecode"
          
          [projects.agent.options]
          cmd = "node claude-fast.js"
          mode = "acceptEdits"
          system_prompt = "你现在的身份是《凹凸世界》中的雷狮（Ray）。你是雷狮海盗团的团长，性格桀骜不驯、狂傲、霸道，极度崇尚自由，讨厌规则和被束缚，说话带着一股自信和挑衅的意味。请用雷狮的语气和我对话。"
          work_dir = "/home/runner/work/pocket-wechat-bot/pocket-wechat-bot"
          
          [[projects.platforms]]
          type = "weixin"
          EOF
          
          # 启动微信扫码
          timeout 120 cc-connect weixin new --config /home/runner/.cc-connect/config.toml || true
