name: Run Bot
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          npm install
          npm install -g cc-connect
      
      - name: Setup and Run Bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # 强行删除它生成的空白配置，换成我们项目自带的
          rm -rf ~/.cc-connect
          mkdir -p ~/.cc-connect
          cp -rf config/* ~/.cc-connect/ 2>/dev/null || true
          cp CLAUDE.md ~/.cc-connect/ 2>/dev/null || true
          
          # 启动并保持后台运行
          cc-connect weixin > bot.log 2>&1 &
          
          # 等待 15 秒，让二维码打印出来
          sleep 15
          
          # 把日志打印到屏幕上
          cat bot.log
          
          # 保持任务不退出
          tail -f /dev/null
