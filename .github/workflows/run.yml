name: Run Bot
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Clone cc-connect
        run: git clone https://github.com/chenhg5/cc-connect.git /tmp/cc-connect
      
      - name: Build and install cc-connect
        run: |
          cd /tmp/cc-connect
          go build -o /usr/local/bin/cc-connect .
          chmod +x /usr/local/bin/cc-connect
      
      - name: Run Bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: cc-connect
