name: Run Bot
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          npm install
          npm install -g cc-connect
      
      - name: Setup and Run Bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # 1. 先让 cc-connect 自己生成一份默认配置
          cc-connect init || true
          
          # 2. 把我们项目里的角色设定（CLAUDE.md）覆盖进去
          mkdir -p ~/.cc-connect
          cp CLAUDE.md ~/.cc-connect/ 2>/dev/null || true
          cp -rf config/* ~/.cc-connect/ 2>/dev/null || true
          
          # 3. 强行启动微信扫码
          timeout 120 cc-connect weixin setup || true
